    <main>
        <h1>Contato</h1>
        <p>Tem alguma dúvida ou sugestão? Escreva para nós.</p>
        <form onsubmit="return enviarContato()">
            <label for="c-nome">Nome</label>
            <input type="text" id="c-nome" required>

            <label for="c-email">E-mail</label>
            <input type="email" id="c-email" required>

            <label for="c-msg">Mensagem</label>
            <textarea id="c-msg" rows="5" required></textarea>

            <br><br>
            <button class="botao" type="submit">Enviar mensagem</button>
        </form>
    </main>
